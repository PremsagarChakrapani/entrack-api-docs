openapi: 3.0.0 

info: 

  title: EnTrack APIs

  version: 1.0.0 

  description: EnTrack APIs documentation for Request Bodies.


tags:
  - name: Entrack APIs

servers: 

- url: http://localhost:7071/api 

components: 

  securitySchemes: 

    bearerAuth:  

      type: http 

      scheme: bearer 

      bearerFormat: JWT  

security: 

  - bearerAuth: []  

paths: 

# first api 

# ----------------------------------------------------------------- 

  /devices/energy/active: 

    get: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for getting active time for energy graphs 

      operationId: activePeriod 

       - name 

      parameters: 

        - name: deviceId 

          in: query 

          required: true 

          schema: 

            type: string 

      responses: 
        '200':

          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      yearData:
                        type: array
                        items:
                          type: object
                          properties:
                            activeYear:
                              type: integer
                              example: 2024
                            activeMonth:
                              type: array
                              items:
                                type: integer
                                example: 12
              example:
                statusCode: 200
                message: "success"
                data:
                  yearData:
                    - activeYear: 2024
                      activeMonth: [12, 11, 10, 9, 8, 7, 6, 5, 4]
                    - activeYear: 2025
                      activeMonth: [1]

#  second api

# -------------------------------------------------------------- 

  /applianceEnergy: 

    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for storing only type 1 appliance energy at end of prediction. 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                energyData: 

                  type: array 

                  items: 

                    type: object 

                    properties: 

                      deviceId: 

                        type: string 

                        example: 1 

                      subCategory: 

                        type: string 

                        example: dry iron 

                      categoryId: 

                        type: string 

                        example: 8 

                      applianceId: 

                        type: string 

                        example: 4 

                      energy: 

                        type: string 

                        example: idk             

      responses:
        '200':
          description: Success response
          
                  

#  third api 

#------------------------------------------------------------------------------- 

  /applianceIdMapping: 

    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for getting TTL time across labelid and deviceid 

      operationId: createPayment 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties: 

                orderId: 

                  type: string 

                amount: 

                  type: number 

      responses:
        200:
          description: Success response with empty data
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array
                    items: {}
              example:
                statusCode: 200
                message: "success"
                data: []

#  fourth api 

#------------------------------------------------------------------------------- 

  /appliances: 

    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for capturing appliance. 

      operationId: appliances 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                energyData: 

                  type: array 

                  items: 

                    type: object 

                    properties: 

                      deviceId: 

                        type: string 

                        example: 1 

                      categoryID: 

                        type: string 

                        example: dry iron 

                      subCategoryID: 

                        type: string 

                        example: 8 

                      subCategoryName: 

                        type: string 

                        example: 4 

                      CategoryType: 

                        type: string 

                        example: idk 

      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      applianceId:
                        type: string
                        format: uuid
                        example: "22d6690c-d223-4acc-ad29-f25289ddb5a6"
                      labelOn:
                        type: integer
                        example: 17391825054131
                      labelOff:
                        type: integer
                        example: 17391825045630
                      applianceName:
                        type: string
                        example: "Kettle-0"
              example:
                statusCode: 200
                message: "success"
                data:
                  applianceId: "22d6690c-d223-4acc-ad29-f25289ddb5a6"
                  labelOn: 17391825054131
                  labelOff: 17391825045630
                  applianceName: "Kettle-0" 

#  fifth api 

#------------------------------------------------------------------------------- 

  /autoDiscovery: 

    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for sending autoDiscovery request to EnergyAuditor 

      operationId: autoDiscovery 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                eaDeviceId: 

                  type: string 

                applianceDeviceId: 

                  type: string 

                applianceProductCode: 

                  type: string 

      responses: 

        "200": 

          description: works 

#  sixth api 

#------------------------------------------------------------------------------- 

  /botLife: 

    get: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for storing and retreiving the Bot Life Data. 

      operationId: botLife 

      parameters: 

        - name: deviceId 

          in: query 

          required: true 

          schema: 

            type: object 

            properties: 

              deviceId: 

                type: string 

              type: 

                type: number 

              commonKey: 

                type: string 

      responses:
        200:
          description: Success response with different data structures
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    oneOf:
                      - type: object
                        properties:
                          dailyData:
                            type: array
                            items:
                              type: object
                              properties:
                                offlineHours:
                                  type: number
                                  example: 0
                                date:
                                  type: integer
                                  example: 1
                      - type: object
                        properties:
                          monthlyData:
                            type: array
                            items:
                              type: object
                              properties:
                                offlineHours:
                                  type: number
                                  example: 535.1
                                month:
                                  type: integer
                                  example: 1
                      - type: object
                        properties:
                          currentMonthData:
                            type: array
                            items:
                              type: object
                              properties:
                                offlineHours:
                                  type: number
                                  example: 535.1
              examples:
                dailyDataExample:
                  summary: Response for daily data
                  value:
                    statusCode: 200
                    message: "success"
                    data:
                      dailyData:
                        - offlineHours: 0
                          date: 1
                        - offlineHours: 0
                          date: 2
                        - offlineHours: 0.2
                          date: 3
                monthlyDataExample:
                  summary: Response for monthly data
                  value:
                    statusCode: 200
                    message: "success"
                    data:
                      monthlyData:
                        - offlineHours: 535.1
                          month: 1
                        - offlineHours: 232
                          month: 2
                currentMonthDataExample:
                  summary: Response for current month data
                  value:
                    statusCode: 200
                    message: "success"
                    data:
                      currentMonthData:
                        - offlineHours: 535.1
    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for storing and retreiving the Bot Life Data. 

      operationId: botLife 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                data:  

                  type: object 

                  properties:  

                    startTime: 

                      type: string 

                    endTime: 

                      type: string 

                    botLifeData:  

                      type: object 

                      properties: 

                        minItems:  

                          type: number 

                        items:  

                          type: object 

                          properties:  

                            deviceId: 

                              type: string 

                            offlineHours: 

                              type: number 

      responses:
        200:
          description: Success response with empty data
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array
                    items: {}
              example:
                statusCode: 200
                message: "success"
                data: []

#  seventh api 

#------------------------------------------------------------------------------- 

  /categories: 

    get: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for getting list of categories and related info to Training & Retraining. 

      operationId: categories 

      parameters: 

      - name: AllDataFlag 

        in: query 

        description: Filters data based on mode (e.g., 'Training' or 'Retraining') 

        required: false 

        schema: 

          type: integer 

          enum: 

          - '0' 

          - '1' 

        example: '0' 

      responses: 

        '200': 

          description: Successful response with category data 

          content: 

            application/json: 

              schema: 

                oneOf: 

                - description: Response for AllDataFlag=0 

                  type: object 

                  properties: 

                    statusCode: 

                      type: integer 

                      example: 200 

                    message: 

                      type: string 

                      example: success 

                    data: 

                      type: object 

                      properties: 

                        categoryData: 

                          type: array 

                          items: 

                            type: object 

                            properties: 

                              id: 

                                type: string 

                                format: uuid 

                                example: f78cdf35-f5cc-4416-8f62-296a5449fbe1 

                              categoryId: 

                                type: integer 

                                example: 1 

                              categoryName: 

                                type: string 

                                example: Cleaning 

                              categoryAliasName: 

                                type: string 

                                example: Cleaning 

                              additionFlag: 

                                type: integer 

                                example: 1 

                              subCategory: 

                                type: array 

                                items: 

                                  type: object 

                                  properties: 

                                    subCategoryId: 

                                      type: integer 

                                      example: 101 

                                    subCategoryName: 

                                      type: string 

                                      example: Vacuum Cleaner 

                                    categoryType: 

                                      type: integer 

                                      example: 1 

                                    ttlTime: 

                                      type: integer 

                                      example: -1 

                                    additionFlag: 

                                      type: integer 

                                      example: 1 

                              metaData: 

                                type: array 

                                items: 

                                  type: object 

                                  properties: 

                                    id: 

                                      type: integer 

                                      example: '1' 

                                    mode: 

                                      type: string 

                                      example: Training 

                                    count: 

                                      type: integer 

                                      example: '8' 

                - description: Response for AllDataFlag=1 

                  type: object 

                  properties: 

                    statusCode: 

                      type: integer 

                      example: 200 

                    message: 

                      type: string 

                      example: success 

                    data: 

                      type: object 

                      properties: 

                        metaData: 

                          type: array 

                          items: 

                            type: object 

                            properties: 

                              id: 

                                type: string 

                                example: '1' 

                              mode: 

                                type: string 

                                example: Retraining 

                              count: 

                                type: integer 

                                example: 8 

        '400': 

          description: Bad request. AllDataFlag must be equal 1 or 0 

          content: 

            application/json: 

              schema: 

                oneOf: 

                - description: Response for AllDataFlag=0 

                  type: object 

                  properties: 

                    statusCode: 

                      type: integer 

                      example: 400 

                    message: 

                      type: string 

                      example: err 

                    data: 

                      type: array 

                      example: [] 

        '500': 

          description: Server Error 

# eighth api 

# ------------------------------------------------------------------------------ 

  /dataCache: 

    get: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for getting data from cache 

      operationId: dataCache 

      parameters: 

        - name: topic 

          in: query 

          required: true 

          schema: 

            type: string 

      responses:
          200:
            description: Success response with notification list
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    statusCode:
                      type: integer
                      example: 200
                    message:
                      type: string
                      example: "success"
                    data:
                      type: object
                      properties:
                        notificationList:
                          type: array
                          items:
                            type: object
                            properties:
                              eventId:
                                type: string
                                format: uuid
                                example: "40594d83-7569-44d1-904d-347daf7e3776"
                              applianceCategory:
                                type: string
                                example: "SplitAC"
                              timeStamp:
                                type: integer
                                description: "Unix timestamp representing the event time"
                                example: 1736428969
                              content:
                                type: object
                                properties:
                                  title:
                                    type: string
                                    example: "OFF"
                                  body:
                                    type: string
                                    example: "SplitAC was turned ON for 7 minutes"
                                  metaData:
                                    type: object
                                    additionalProperties: true
                example:
                  statusCode: 200
                  message: "success"
                  data:
                    notificationList:
                      - eventId: "40594d83-7569-44d1-904d-347daf7e3776"
                        applianceCategory: "SplitAC"
                        timeStamp: 1736428969
                        content:
                          title: "OFF"
                          body: "SplitAC was turned ON for 7 minutes"
                          metaData: {}
                      - eventId: "e266bd34-e909-4a19-839f-6ec2f71ba486"
                        applianceCategory: "Refrigerator"
                        timeStamp: 1736428969
                        content:
                          title: "OFF"
                          body: "Refrigerator was turned ON for 58 minutes 12 seconds"
                          metaData: {}
                      - eventId: "acc71659-6047-4dbd-866d-d9ed5a791780"
                        applianceCategory: "SplitAC"
                        timeStamp: 1736428549
                        content:
                          title: "ON"
                          body: "SplitAC was turned ON"
                          metaData: {}
                      - eventId: "c6c2a302-8cd4-4862-a391-b7a5a007a76f"
                        applianceCategory: "SplitAC"
                        timeStamp: 1736427787
                        content:
                          title: "OFF"
                          body: "SplitAC was turned ON for 8 minutes 54 seconds"
                          metaData: {}
                      - eventId: "c934d0db-bb10-4afe-8293-1e1f2851411d"
                        applianceCategory: "Kettle"
                        timeStamp: 1736427786
                        content:
                          title: "OFF"
                          body: "Kettle-0 was turned ON for 3 minutes 53 seconds"
                          metaData: {}
                      - eventId: "0de5153a-b9e2-4b2a-ac12-a77c8b6576aa"
                        applianceCategory: "Kettle"
                        timeStamp: 1736427553
                        content:
                          title: "ON"
                          body: "Kettle-0 was turned ON"
                          metaData: {}
                      - eventId: "06c73e54-3138-46e0-9219-ca00c6c84fe8"
                        applianceCategory: "Kettle"
                        timeStamp: 1736427512
                        content:
                          title: "OFF"
                          body: "Kettle-0 was turned ON for 4 minutes 16 seconds"
                          metaData: {}



    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for storing data in cache 

      operationId: dataCache 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                notificationList:  

                  type: object 

                  properties:  

                    items: 

                      type: object 

                      properties: 

                        eventId: 

                          type: string 

                        timestamp: 

                          type: number 

                        content: 

                          type: object 

                          properties: 

                            title:  

                              type: string 

                            body: 

                              type: string 

                            metaData: 

                              type: object                        

      responses: 

        "200": 

          description: works 

#ninth api 

# ------------------------------------------------------------------------------ 

  /deviceConfigurations: 

    get: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for retreiving user configuration. 

      operationId: deviceConfigurations 

      parameters: 

        - name: deviceId 

          in: query 

          required: true 

          schema: 

            type: string 

      responses:
        200:
          description: Success response with device energy configuration data
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: "HTTP status code"
                    example: 200
                  message:
                    type: string
                    description: "Response message"
                    example: "success"
                  data:
                    type: object
                    properties:
                      deviceId:
                        type: string
                        description: "ID of the device"
                        example: "3390EB2BC2B190B0802198411994E6862D0A38"
                      load:
                        type: integer
                        description: "Load of the device"
                        example: 5
                      billingCycleStartDate:
                        type: string
                        format: date
                        description: "Start date of the billing cycle"
                        example: "2025/02/01"
                      billingCycleEndDate:
                        type: string
                        format: date
                        description: "End date of the billing cycle"
                        example: "2025/02/28"
                      energyThreshold:
                        type: integer
                        description: "Energy consumption threshold"
                        example: 200
                      customConfig:
                        type: object
                        description: "Custom configuration for the device"
                        properties:
                          energyThreshold:
                            type: integer
                            description: "Energy consumption threshold in custom configuration"
                            example: 200
                          notificationFlag:
                            type: integer
                            description: "Notification flag indicating whether notifications are enabled"
                            example: 0
                          billingCycleStartDate:
                            type: string
                            format: date
                            description: "Start date of the billing cycle in custom configuration"
                            example: "2025/02/01"
                          billingCycleEndDate:
                            type: string
                            format: date
                            description: "End date of the billing cycle in custom configuration"
                            example: "2025/02/28"
      
              example:
                statusCode: 200
                message: "success"
                data:
                  deviceId: "3390EB2BC2B190B0802198411994E6862D0A38"
                  load: 5
                  billingCycleStartDate: "2025/02/01"
                  billingCycleEndDate: "2025/02/28"
                  energyThreshold: 200
                  customConfig:
                    energyThreshold: 200
                    notificationFlag: 0
                    billingCycleStartDate: "2025/02/01"
                    billingCycleEndDate: "2025/02/28"
    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for storing user configuration. 

      operationId: deviceConfigurations 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                deviceId:  

                  type: string 

                energyThreshold: 

                  type: number 

                properties: 

                  type: object 

                  properties: 

                    load: 

                      type: number 

                    billingCycle: 

                      type: object 

                      properties: 

                        startDate:  

                          type: string 

                        endDate: 

                          type: string                       

      responses:
        200:
          description: Success response with device details
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array


