#twelfth api 

#------------------------------------------------------------------------------ 

  /energyDetailsBreakdown: 

    post: 
      tags: 
        - Entrack APIs
      summary: JavaScript HTTP trigger function processed a request for sending autoDiscovery request to EnergyAuditor 

      operationId: autoDiscovery 

      requestBody: 

        required: true 

        content: 

          application/json: 

            schema: 

              type: object 

              properties:  

                deviceId: 

                  type: string 

                startDate: 

                  type: string 

                endDate: 

                  type: string 

                level: 

                  type: integer 

      responses:
        200:
          description: Success response with energy consumption data
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: "HTTP status code"
                    example: 200
                  message:
                    type: string
                    description: "Response message"
                    example: "success"
                  data:
                    type: object
                    properties:
                      categoryData:
                        type: array
                        description: "List of energy consumption by category and subcategory"
                        items:
                          type: object
                          properties:
                            categoryId:
                              type: integer
                              description: "ID of the category"
                              example: 3
                            energy:
                              type: number
                              format: float
                              description: "Total energy consumption of the category"
                              example: 5.738142377777778
                            subCategoryData:
                              type: array
                              description: "List of energy consumption by subcategory"
                              items:
                                type: object
                                properties:
                                  subCategoryId:
                                    type: integer
                                    description: "ID of the subcategory"
                                    example: 107
                                  energy:
                                    type: number
                                    format: float
                                    description: "Energy consumption of the subcategory"
                                    example: 5.738142377777778
      
              example:
                statusCode: 200
                message: "success"
                data:
                  categoryData:
                    - categoryId: 3
                      energy: 5.738142377777778
                      subCategoryData:
                        - subCategoryId: 107
                          energy: 5.738142377777778
                    - categoryId: 6
                      energy: 2.038273871577381
                      subCategoryData:
                        - subCategoryId: 117
                          energy: 0.9152738715773809
                        - subCategoryId: 114
                          energy: 1.123
                    - categoryId: 8
                      energy: 0.07585050648148148
                      subCategoryData:
                        - subCategoryId: 132
                          energy: 0.07585050648148148
                    - categoryId: 13
                      energy: 19.93724803027445
                      subCategoryData:
                        - subCategoryId: 143
                          energy: 19.93724803027445
 

